name: safiabad_weather_native
description: Native Persian weather application with precise GPS and live animated UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  shamsi_date: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
