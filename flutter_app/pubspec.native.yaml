name: safiabad_weather_native
description: Native Persian live weather application with precise GPS, saved location and animated UI.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  http: ^1.2.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  shamsi_date: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
    - family: Nazanin
      fonts:
        - asset: assets/fonts/Far_Nazanin.ttf
    - family: Titr
      fonts:
        - asset: assets/fonts/Far_TitrBd.ttf
