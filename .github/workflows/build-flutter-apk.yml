name: Build Flutter Native APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android native scaffold
        working-directory: flutter_app
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf native_build
          flutter create native_build \
            --platforms=android \
            --project-name=safiabad_weather_native \
            --org=ir.safiabad
          rm -rf native_build/lib native_build/test
          cp -R source/lib native_build/lib
          cat v3_sources/weather_app_compact/*.part > native_build/lib/weather_app.dart

          # Dart's conditional expression infers num when the fallback is integer 0.
          # Keep rainfall values explicitly double for the V3 models.
          sed -i "s/final amount = i < amounts.length ? _double(amounts\[i\]) : 0;/final amount = i < amounts.length ? _double(amounts[i]) : 0.0;/" native_build/lib/services.dart
          sed -i "s/final amount = i < precipitation.length ? _double(precipitation\[i\]) : 0;/final amount = i < precipitation.length ? _double(precipitation[i]) : 0.0;/" native_build/lib/services.dart

          cp pubspec.native.yaml native_build/pubspec.yaml
          cp android_overrides/AndroidManifest.xml native_build/android/app/src/main/AndroidManifest.xml

          mkdir -p native_build/assets/fonts

          curl --fail --location --retry 3 \
            'https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Regular.ttf' \
            --output native_build/assets/fonts/Vazirmatn-Regular.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/pishnahadebehtar/Sport_News_Website/8fd3bb4a913670c52db3b047e1e6f7d3927c2d24/public/font/Far_Nazanin.ttf' \
            --output native_build/assets/fonts/Far_Nazanin.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/fahimahmadi/ak_hospital_front/4d25d3712a000c61c5c5d7181d758cbfaa0272f0/src/assets/fonts/Far_TitrBd.ttf' \
            --output native_build/assets/fonts/Far_TitrBd.ttf

          test -s native_build/assets/fonts/Vazirmatn-Regular.ttf
          test -s native_build/assets/fonts/Far_Nazanin.ttf
          test -s native_build/assets/fonts/Far_TitrBd.ttf
          ls -lh native_build/assets/fonts

      - name: Resolve Flutter packages
        working-directory: flutter_app/native_build
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: flutter_app/native_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        working-directory: flutter_app/native_build
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -f flutter_app/native_build/build/app/outputs/flutter-apk/app-release.apk
          ls -lh flutter_app/native_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: SafiabadWeather-Native-V3-release
          path: flutter_app/native_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
