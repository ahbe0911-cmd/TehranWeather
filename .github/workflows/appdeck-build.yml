name: Build AppDeck V2 APK

on:
  push:
    branches: [ "appdeck-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract AppDeck sources
        run: tar -xJf appdeck/AppDeckAndroid.tar.xz

      - name: Prepare compatible Android build
        run: |
          sed -i '/org.jetbrains.kotlin.android/d' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/compose-bom:2026.08.00/compose-bom:2026.06.00/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.12.1/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/core-ktx:1.18.0/core-ktx:1.17.0/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.10.0/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.10.0/' AppDeckAndroid/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run tests
        working-directory: AppDeckAndroid
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: AppDeckAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppDeck-v2-debug-apk
          path: AppDeckAndroid/app/build/outputs/apk/debug/app-debug.apk
