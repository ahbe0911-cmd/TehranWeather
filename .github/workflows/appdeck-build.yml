name: Build AppDeck APK

on:
  push:
    branches: [ "appdeck-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract AppDeck sources
        run: tar -xJf appdeck/AppDeckAndroid.tar.xz

      - name: Use Android API 36
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' AppDeckAndroid/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' AppDeckAndroid/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run tests
        working-directory: AppDeckAndroid
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: AppDeckAndroid
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppDeck-debug-apk
          path: AppDeckAndroid/app/build/outputs/apk/debug/app-debug.apk
