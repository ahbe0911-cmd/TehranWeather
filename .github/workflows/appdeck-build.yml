name: Build AppDeck V3 APK

on:
  push:
    branches: [ "appdeck-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble AppDeck V3 sources
        run: |
          cat appdeck/v3/chunk_* | base64 -d > AppDeckAndroid_v3.tar.xz
          tar -xJf AppDeckAndroid_v3.tar.xz

      - name: Prepare AGP 9 build
        run: |
          sed -i '/org.jetbrains.kotlin.android/d' AppDeckAndroid_v3/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run tests
        working-directory: AppDeckAndroid_v3
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: AppDeckAndroid_v3
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppDeck-v3-debug-apk
          path: AppDeckAndroid_v3/app/build/outputs/apk/debug/app-debug.apk
