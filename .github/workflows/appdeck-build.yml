name: Build AppDeck V10 APK

on:
  push:
    branches: [ "appdeck-v10" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble AppDeck V3 base
        run: |
          cat appdeck/v3/chunk_* | base64 -d > AppDeckAndroid_v3.tar.xz
          tar -xJf AppDeckAndroid_v3.tar.xz
          mv AppDeckAndroid_v3 AppDeckAndroid_v9

      - name: Apply AppDeck V4 optimized base
        run: |
          cat appdeck/v4/overlay_chunk_* | base64 -d > /tmp/appdeck_v4_overlay.tar.gz
          gzip -t /tmp/appdeck_v4_overlay.tar.gz
          tar -xzf /tmp/appdeck_v4_overlay.tar.gz -C AppDeckAndroid_v9
          cp appdeck/v4/InstalledAppsRepository.kt AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/data/InstalledAppsRepository.kt
          cp AppDeckAndroid_v9/app/src/main/res/mipmap-nodpi/ic_launcher.webp AppDeckAndroid_v9/app/src/main/res/mipmap-nodpi/ic_launcher_round.webp
          rm -rf AppDeckAndroid_v9/app/src/main/res/mipmap-anydpi AppDeckAndroid_v9/app/src/main/res/mipmap-anydpi-v26
          sed -i '/org.jetbrains.kotlin.android/d' AppDeckAndroid_v9/app/build.gradle.kts

      - name: Apply AppDeck V5 compact header and touch reorder
        run: python appdeck/v5/apply_v5.py AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/ui/AppDeckApp.kt

      - name: Apply AppDeck V6 app action menu
        run: python appdeck/v6/apply_v6.py AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/ui/AppDeckApp.kt

      - name: Apply AppDeck V7 fluid reorder and delayed actions
        run: |
          python appdeck/v7/apply_v7.py \
            AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/ui/AppDeckApp.kt \
            AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/MainViewModel.kt \
            AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/data/AppStateRepository.kt

      - name: Apply AppDeck V8 accidental launch fix
        run: python appdeck/v8/apply_v8.py AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/ui/AppDeckApp.kt

      - name: Apply AppDeck V9 search visual and auto refresh upgrade
        run: |
          python appdeck/v9/apply_v9.py \
            AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/ui/AppDeckApp.kt \
            AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/MainActivity.kt
          python appdeck/v9/fix_v9.py AppDeckAndroid_v9/app/src/main/java/ir/appdeck/launcher/ui/AppDeckApp.kt
          sed -i 's/versionCode = 4/versionCode = 9/' AppDeckAndroid_v9/app/build.gradle.kts
          sed -i 's/versionName = "4.0.0"/versionName = "9.0.0"/' AppDeckAndroid_v9/app/build.gradle.kts

      - name: Apply AppDeck V10 compact card and productivity upgrade
        run: |
          cat \
            appdeck/v10/overlay_chunk_00 \
            appdeck/v10/overlay_chunk_01a \
            appdeck/v10/overlay_chunk_01b \
            appdeck/v10/overlay_chunk_02 \
            appdeck/v10/overlay_chunk_03a \
            appdeck/v10/overlay_chunk_03b \
            appdeck/v10/overlay_chunk_04 \
            | base64 -d > /tmp/appdeck_v10_overlay.tar.gz
          echo "07ed8faaa9ae54b9f0644ddb2501ed9aa5f75a020837d59dd1cafc116446b526  /tmp/appdeck_v10_overlay.tar.gz" | sha256sum -c -
          gzip -t /tmp/appdeck_v10_overlay.tar.gz
          tar -xzf /tmp/appdeck_v10_overlay.tar.gz -C AppDeckAndroid_v9
          mv AppDeckAndroid_v9 AppDeckAndroid_v10
          grep -q 'versionCode = 10' AppDeckAndroid_v10/app/build.gradle.kts
          grep -q 'versionName = "10.0.0"' AppDeckAndroid_v10/app/build.gradle.kts

      - name: Package complete V10 source
        run: tar -czf AppDeckAndroid-v10-complete-source.tar.gz AppDeckAndroid_v10

      - name: Upload complete V10 source
        uses: actions/upload-artifact@v4
        with:
          name: AppDeck-v10-complete-source
          path: AppDeckAndroid-v10-complete-source.tar.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        working-directory: AppDeckAndroid_v10
        run: gradle testDebugUnitTest --stacktrace

      - name: Build optimized release APK
        working-directory: AppDeckAndroid_v10
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppDeck-v10-pro-apk
          path: AppDeckAndroid_v10/app/build/outputs/apk/release/app-release.apk
